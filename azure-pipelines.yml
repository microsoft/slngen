resources:
- repo: self

variables:
  ArtifactsDirectoryName: 'artifacts'
  BuildConfiguration: 'Debug'
  BuildPlatform: 'Any CPU'
  MSBuildArgs: '"/Property:Platform=$(BuildPlatform);Configuration=$(BuildConfiguration)" "/p:RestoreConfigFile=$(Build.SourcesDirectory)\NuGet.config"'
  SignType: 'Test'
  DotNetInstallDirectory: '$(Agent.TempDirectory)\dotnet'

trigger:
  batch: 'true'
  branches:
    include:
    - 'main'
    - 'rel/*'
  paths:
    exclude:
    - '*.md'
pr:
  branches:
    include:
    - 'main'
    - 'rel/*'
  paths:
    exclude:
    - '*.md'

jobs:
- job: BuildAndTest
  strategy:
    matrix:
      Windows:
        vmImage: windows-2025-vs2026
        osName: Windows
  displayName: 'Build and Test'
  pool:
    vmImage: $(vmImage)
  steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.x'
      installationPath: '$(DotNetInstallDirectory)'

  - task: UseDotNet@2
    displayName: 'Install .NET 11 SDK'
    inputs:
      packageType: 'sdk'
      version: '11.0.x'
      installationPath: '$(DotNetInstallDirectory)'

  - powershell: |
      dotnet --info
    displayName: 'Show .NET info'
    condition: eq(variables.osName, 'Windows')

  - task: NuGetAuthenticate@1
    displayName: 'Authenticate Azure Artifacts feeds'

  - task: VSBuild@1
    displayName: 'Build (Visual Studio)'
    inputs:
      vsVersion: '18.0'
      msbuildArgs: '$(MSBuildArgs) "/BinaryLogger:$(ArtifactsDirectoryName)/build.binlog"'
    condition: eq(variables.osName, 'Windows')

  - task: DotNetCoreCLI@2
    displayName: 'Build (dotnet)'
    inputs:
      command: 'build'
      arguments: '$(MSBuildArgs) "/BinaryLogger:$(ArtifactsDirectoryName)/build.binlog"'
    condition: ne(variables.osName, 'Windows')

  - powershell: |
      $dotnetDirectory = Split-Path (Get-Command dotnet).Source
      $env:Path = "$dotnetDirectory;$env:WINDIR\System32;$env:WINDIR"
      if ((dotnet --version) -notlike '11.*') { throw 'Expected a .NET 11 SDK' }
      dotnet 'src\Microsoft.VisualStudio.SlnGen.Tool\bin\$(BuildConfiguration)\net10.0\slngen.dll' --version
      if ($LASTEXITCODE -ne 0) { throw 'SlnGen failed with the .NET 11 SDK' }
    displayName: 'Run SlnGen tool with .NET 11 SDK'
    condition: and(succeeded(), eq(variables.osName, 'Windows'))

  - task: DotNetCoreCLI@2
    displayName: 'Run Unit Tests (.NET Framework v4.7.2)'
    inputs:
      command: 'test'
      arguments: '--no-restore --no-build --framework net472 /noautorsp $(MSBuildArgs) "/BinaryLogger:$(ArtifactsDirectoryName)/test-net472.binlog"'
      testRunTitle: '$(osName) .NET Framework v4.7.2'
    condition: and(succeededOrFailed(), eq(variables.osName, 'Windows'))

  - task: DotNetCoreCLI@2
    displayName: 'Run Unit Tests (.NET 10)'
    inputs:
      command: 'test'
      arguments: '--no-restore --no-build --framework net10.0 /noautorsp $(MSBuildArgs) "/BinaryLogger:$(ArtifactsDirectoryName)/test-net10.0.binlog"'
      testRunTitle: '$(osName) .NET 10.0'
    condition: succeededOrFailed()

  - task: DotNetCoreCLI@2
    displayName: 'Run Unit Tests (.NET 11)'
    inputs:
      command: 'test'
      arguments: '--framework net11.0 /noautorsp $(MSBuildArgs) "/BinaryLogger:$(ArtifactsDirectoryName)/test-net11.0.binlog"'
      testRunTitle: '$(osName) .NET 11.0'
    condition: succeededOrFailed()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifacts'
    inputs:
      PathtoPublish: '$(ArtifactsDirectoryName)'
      ArtifactName: $(ArtifactsDirectoryName)-$(osName)
    condition: always()

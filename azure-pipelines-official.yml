resources:
  repositories:
  - repository: MicroBuildTemplate
    type: git
    name: 1ESPipelineTemplates/MicroBuildTemplate
    ref: refs/tags/release
variables:
  LogDirectory: $(Build.ArtifactStagingDirectory)/logs
  ArtifactsDirectory: artifacts
  BuildConfiguration: 'Release'
  BuildPlatform: 'Any CPU'
  MSBuildArgs: '"/Property:Platform=$(BuildPlatform);Configuration=$(BuildConfiguration)" "/p:RestoreConfigFile=$(Build.SourcesDirectory)\NuGet.config" "/BinaryLogger:$(Build.SourcesDirectory)\$(ArtifactsDirectory)\msbuild.binlog"'
  SignType: 'Real'
  DotNetInstallDirectory: '$(Agent.TempDirectory)\dotnet'

trigger:
  batch: true
  branches:
    include:
    - 'main'
    - 'refs/tags/*'
  paths:
    exclude:
    - '*.md'
pr: none
extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    sdl:
      sbom:
        enabled: false
    pool:
      name: VSEng-MicroBuildVSStable
      demands:
      - msbuild
      - visualstudio
      os: windows
    stages:
    - stage: Build
      displayName: 'Build'
      jobs:
      - job: Build
        displayName: 'Build'
        pool:
          name: 'VSEng-MicroBuildVSStable'
        templateContext:
          mb:
            signing:
              enabled: true
              signType: $(SignType)
              signWithProd: true
              zipSources: false
          outputs:
          - output: pipelineArtifact
            displayName: 'Publish Artifacts'
            condition: always()
            targetPath: $(ArtifactsDirectory)
            artifactName: 'artifacts'
            # Production release jobs require an SBOM for consumed artifacts
            sbomEnabled: true
        steps:
        - script: 'echo ##vso[task.setvariable variable=SignType;]Real'
          displayName: 'Set SignType to Real for tagged commits'
          condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
        - task: UseDotNet@2
          displayName: 'Install .NET 8 SDK'
          inputs:
            packageType: 'sdk'
            version: '8.x'
            installationPath: '$(DotNetInstallDirectory)'
        - task: UseDotNet@2
          displayName: 'Install .NET 9 SDK'
          inputs:
            packageType: 'sdk'
            version: '9.x'
            installationPath: '$(DotNetInstallDirectory)'
        - task: UseDotNet@2
          displayName: 'Install .NET 10 SDK'
          inputs:
            packageType: 'sdk'
            version: '10.x'
            installationPath: '$(DotNetInstallDirectory)'
        - task: UseDotNet@2
          displayName: 'Install .NET 11 SDK (preview)'
          inputs:
            packageType: 'sdk'
            version: '11.0.x'
            includePreviewVersions: true
            installationPath: '$(DotNetInstallDirectory)'
        - powershell: |
            dotnet --info
          displayName: 'Show .NET info'

        - task: NuGetAuthenticate@1
          displayName: 'Authenticate Azure Artifacts feeds'

        - task: VSBuild@1
          displayName: 'Build Solution'
          inputs:
            solution: '**\*.sln'
            vsVersion: '18.0'
            msbuildArgs: '$(MSBuildArgs)'
        - task: PublishSymbols@2
          displayName: 'Publish Symbols'
          inputs:
            SearchPattern: '**/bin/**/*.pdb'
            IndexSources: false
            SymbolServerType: TeamServices

    - stage: Release
      displayName: 'Release'
      dependsOn: Build
      condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
      jobs:
      - job: ApprovePackagePush
        displayName: 'Approve package push'
        pool: server
        timeoutInMinutes: 43200
        steps:
        - task: ManualValidation@1
          displayName: 'Approve pushing packages to NuGet.org and CoreXT'
          timeoutInMinutes: 43200
          inputs:
            notifyUsers: |
              angerlic@microsoft.com
              mruxmohan@microsoft.com
            approvers: 'angerlic@microsoft.com,mruxmohan@microsoft.com'
            allowApproversToApproveTheirOwnRuns: true
            instructions: 'Approve to push the SlnGen packages from build $(Build.BuildNumber) ($(Build.SourceBranch)) to NuGet.org and the CloudBuild CoreXT feed.'
            onTimeout: 'reject'

      - job: PublishNuGetOrg
        displayName: 'Publish NuGet.org'
        dependsOn: ApprovePackagePush
        pool:
          name: 'VSEng-MicroBuildVSStable'
          os: windows
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: 'artifacts'
            targetPath: '$(Pipeline.Workspace)/artifacts'
        steps:
        - checkout: none
        - task: 1ES.PublishNuget@1
          displayName: 'NuGet Push'
          inputs:
            packageParentPath: '$(Pipeline.Workspace)/artifacts'
            packagesToPush: '$(Pipeline.Workspace)/artifacts/**/Microsoft.VisualStudio.SlnGen*.nupkg'
            nuGetFeedType: external
            # NuGet.org service connection
            publishFeedCredentials: '841455b3-9379-4c8a-89a3-ec3ba7747d31'
            publishPackageMetadata: true
            allowPackageConflicts: false

      - job: PublishCoreXT
        displayName: 'Publish CoreXT Package'
        dependsOn: ApprovePackagePush
        pool:
          name: 'VSEng-MicroBuildVSStable'
          os: windows
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: 'artifacts'
            targetPath: '$(Pipeline.Workspace)/artifacts'
        steps:
        - checkout: none
        - task: NuGetToolInstaller@1
          displayName: 'Use NuGet'
        - task: AzureCLI@2
          displayName: 'Override NuGet Service Connection Access Token'
          inputs:
            azureSubscription: 'd8767bc1-a109-4cb7-80c2-6ac1ebf4346e'
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              # Get an access token for Azure DevOps (resource id is for AzDO)
              $accessToken = az account get-access-token --query accessToken --resource 499b84ac-1321-427f-aa17-267ca6975798 -o tsv

              # Set the access token as a secret, so it doesn't get leaked in the logs
              Write-Host "##vso[task.setsecret]$accessToken"

              # Override the apitoken of the "CloudBuild-Push" NuGet service connection for the duration of this job
              Write-Host "##vso[task.setendpoint id=da914f0a-3a04-4d03-b5dd-b54c2b715c00;field=authParameter;key=apitoken]$accessToken"
        - task: NuGetAuthenticate@1
          displayName: 'NuGet Authenticate'
          inputs:
            nuGetServiceConnections: 'da914f0a-3a04-4d03-b5dd-b54c2b715c00'
            forceReinstallCredentialProvider: true
        - task: 1ES.PublishNuget@1
          displayName: 'NuGet Push SlnGen.CoreXT'
          inputs:
            packageParentPath: '$(Pipeline.Workspace)/artifacts'
            packagesToPush: '$(Pipeline.Workspace)/artifacts/**/SlnGen.Corext*.nupkg'
            nuGetFeedType: external
            # CloudBuild-Push service connection (https://pkgs.dev.azure.com/cloudbuild/_packaging/CloudBuild/nuget/v3/index.json)
            publishFeedCredentials: 'da914f0a-3a04-4d03-b5dd-b54c2b715c00'
            publishPackageMetadata: true
            allowPackageConflicts: false
